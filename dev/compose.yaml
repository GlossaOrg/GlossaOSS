# Backing services for local development — Postgres and Keycloak, with their ports published so
# the app can be run from the host (or the IDE) against them. Glossa itself is deliberately
# absent: deploy/docker-compose.yml bakes the jar into an image, which is how a deployment is
# verified, not how it is developed.
#
#   docker compose -f dev/compose.yaml up -d
#
# Ports bind on all interfaces, not 127.0.0.1: with a remote DOCKER_HOST they land on the
# daemon's host, and a loopback binding there is reachable by nothing. Point DB_URL in .env at
# that host (`localhost` only when the daemon is local).
# Pinned, because Compose otherwise names the project after this file's directory: from `dev/`
# that would be `dev`, and every volume below would be a brand-new empty one.
name: glossa

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: glossa
      POSTGRES_USER: glossa
      POSTGRES_PASSWORD: ${DB_PASSWORD:-glossa}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glossa -d glossa"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Keycloak, so the OIDC login flow (REQUIREMENTS §11) can be exercised for real in dev. The
  # image is this repo's, only to bake keycloak/glossa-realm.json in — see its Dockerfile.
  # Admin console: http://localhost:8081 (admin/admin). Realm user: dev/dev.
  # No volume, deliberately. Keycloak's state is the realm file baked into the image, re-imported
  # on every start, so what you get is always what is in git — and a console tweak that would not
  # survive a colleague's checkout cannot quietly become load-bearing here. It also removes a real
  # trap: a volume on /opt/keycloak/data shadows the image's data/import, so once it existed, an
  # edited or added realm file silently stopped reaching the container.
  keycloak:
    build: ./keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      # 8080 is Flash's; Keycloak keeps its own default inside the container.
      - "8081:8080"
    healthcheck:
      # The image ships no curl or wget, and /health/ready is on the management port (9000).
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: k\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
