# The three-container deployment REQUIREMENTS §2 describes: Glossa, its Postgres (the only
# persistent datastore), and the LibreTranslate instance that backs automatic suggestions.
#
# Run from the repository root:  docker compose -f deploy/docker-compose.yml up
services:
  glossa:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/glossa
      DB_USERNAME: glossa
      DB_PASSWORD: ${DB_PASSWORD:-glossa}
      LIBRETRANSLATE_URL: http://libretranslate:5000
      # SSO is mandatory for a real deployment (§11) — set these, then uncomment.
      # OIDC_ISSUER: ${OIDC_ISSUER}
      # OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      # OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    ports:
      - "8080:8080"
    # Declared so the JVM's MaxRAMPercentage (see Dockerfile) has a real limit to size itself
    # against — without one it reads the host's total memory.
    mem_limit: 1g

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: glossa
      POSTGRES_USER: glossa
      POSTGRES_PASSWORD: ${DB_PASSWORD:-glossa}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glossa -d glossa"]
      interval: 5s
      timeout: 5s
      retries: 10

  libretranslate:
    image: libretranslate/libretranslate:latest
    environment:
      # Only the languages this deployment actually translates into — LibreTranslate downloads
      # a model per pair at first start, and the full set is several GB.
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-en,it,fr,de,es}
    volumes:
      - libretranslate-models:/home/libretranslate/.local

volumes:
  postgres-data:
  libretranslate-models:
