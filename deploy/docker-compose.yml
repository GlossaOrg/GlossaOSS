# The two-container deployment REQUIREMENTS §2 describes: Glossa and its Postgres, the only
# persistent datastore.
#
# Run from the repository root:  docker compose -f deploy/docker-compose.yml up
services:
  glossa:
    image: glossaorg/glossa:latest
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/glossa
      DB_USERNAME: glossa
      DB_PASSWORD: ${DB_PASSWORD:-glossa}
      # SSO is mandatory for a real deployment (§11) — set these, then uncomment.
      # OIDC_ISSUER: ${OIDC_ISSUER}
      # OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      # OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    ports:
      - "8080:8080"
    # Declared so the JVM's MaxRAMPercentage (see Dockerfile) has a real limit to size itself
    # against — without one it reads the host's total memory.
    mem_limit: 1g

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: glossa
      POSTGRES_USER: glossa
      POSTGRES_PASSWORD: ${DB_PASSWORD:-glossa}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glossa -d glossa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
